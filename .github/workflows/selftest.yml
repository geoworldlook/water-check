# CI: every push and pull request runs the linter, the offline end-to-end test (synthetic lake, no network)
# and a container build. The scheduled job (monitor.yml) only updates data/ and docs/showcase/, so it does not trigger this.
name: selftest

on:
  push:
    branches: [main]
    paths-ignore: ["docs/showcase/**", "data/**"]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Offline end-to-end test
        run: python -m watercheck selftest
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t water-check .
      - name: Run the offline test inside the container
        run: docker run --rm water-check selftest
