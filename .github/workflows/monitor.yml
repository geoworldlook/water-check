# Daily run: gauge levels + new Sentinel-1 scenes -> water area -> scores -> panel.
# The run is incremental: a scene that was computed once is never downloaded again, so a normal day takes minutes.
# The pipeline state lives in data/ (small files), the published result in docs/showcase/ (GitHub Pages).
# Exit code 2 = the data quality gate stopped publication; any failure opens (or updates) an issue.
name: monitor

on:
  schedule:
    - cron: "20 7 * * *"     # 07:20 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run
        run: python -m watercheck run
      - name: Commit and push the result
        if: success()
        run: |
          git config user.name "Dawid"
          git config user.email "160788003+geoworldlook@users.noreply.github.com"
          git add data docs/showcase
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: przebieg dzienny $(date -u +%F)"
            # another commit may have landed during the run: rebase on it and retry
            ok=0
            for attempt in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1
          fi
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Monitor run failed"
          body="The scheduled run failed on $(date -u +%F). Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
